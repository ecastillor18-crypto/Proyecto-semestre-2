spring.application.name=sistema-citas-medicas
server.port=${SERVER_PORT:8080}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/citas_medicas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# El schema SQL es la fuente de verdad de Fase 1. Hibernate solo valida el mapeo JPA.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JWT HS256. JWT_SECRET es obligatoria y debe tener al menos 32 bytes.
app.jwt.issuer=sistema-citas-medicas
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# CORS preparado para los clientes de Fase 3 (Angular) y Fase 4 (Ionic/Capacitor).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8100,capacitor://localhost}

# Datos de demostración para ejecutar la colección de Postman sin crear usuarios manualmente.
# Desactivar con DEMO_DATA_ENABLED=false fuera del entorno académico/local.
app.demo-data.enabled=${DEMO_DATA_ENABLED:true}

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
